name: Publicar videos (YouTube + Instagram)

on:
  # 4 horarios por día, hora Argentina (UTC-3): 10:00 / 13:00 / 17:00 / 20:00
  # -> 13:00 / 16:00 / 20:00 / 23:00 UTC. En cada uno de estos horarios se
  # corre el "ciclo" completo: primero publica el Reel normal de cualquier
  # video que ya haya cumplido sus 24hs desde su Trial Reel, y después sube
  # un Trial Reel nuevo del próximo video de la cola.
  schedule:
    - cron: "0 13,16,20,23 * * *"
  # Para probar manualmente desde la pestaña "Actions" de GitHub sin esperar
  # al horario. "ciclo" es el modo normal; fase1/fase2 son solo para forzar
  # una fase puntual durante una prueba.
  workflow_dispatch:
    inputs:
      fase:
        description: "ciclo (normal) / fase1 o fase2 (forzado, solo para pruebas)"
        required: true
        default: "ciclo"

permissions:
  contents: write

# Evita que dos corridas se ejecuten al mismo tiempo (por ejemplo si el cron
# nativo de GitHub y el respaldo externo de cron-job.org disparan casi juntos).
# Si una ya está corriendo, la siguiente espera en cola en vez de correr en
# paralelo — así nunca se procesa el mismo video "pending" dos veces.
concurrency:
  group: publicar-videos
  cancel-in-progress: false

jobs:
  publicar:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Determinar fase
        id: fase
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "fase=${{ github.event.inputs.fase }}" >> "$GITHUB_OUTPUT"
          else
            echo "fase=ciclo" >> "$GITHUB_OUTPUT"
          fi

      - name: Ejecutar orquestador
        env:
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_BRANCH: main
        run: python scripts/orchestrator.py ${{ steps.fase.outputs.fase }}

      - name: Guardar estado actualizado (queue.json / pending_normal.json)
        run: |
          git config user.name "repost-bot"
          git config user.email "repost-bot@users.noreply.github.com"
          git add config/queue.json state/pending_normal.json state/last_run.json
          git diff --cached --quiet || git commit -m "Actualiza estado [skip ci]"
          git push
